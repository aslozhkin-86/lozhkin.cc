name: Build and publish portfolio

on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - "scripts/sync-static.mjs"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir source install --frozen-lockfile
      - name: Build static site
        run: pnpm --dir source run build
      - name: Update published files
        run: node scripts/sync-static.mjs
      - name: Commit published files
        run: |
          git add -A public
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build site from source [skip ci]"
          git push
